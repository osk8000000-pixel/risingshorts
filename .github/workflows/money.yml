name: money
on:
  schedule:
    - cron: "43 */6 * * *"
  push:
    branches: [main]
    paths: [money/**, .github/workflows/money.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: money
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Collect government support services
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python money/collector.py money/data
      - name: Build site
        run: python money/render.py money/data/services.json money/out
      - name: Deploy to Cloudflare Pages (with live-rate function)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
        working-directory: money
        run: |
          npx --yes wrangler@3 pages project create donchaengim --production-branch=main 2>/dev/null || true
          printf '%s' "$FINLIFE_API_KEY" | npx --yes wrangler@3 pages secret put FINLIFE_API_KEY --project-name donchaengim >/dev/null
          npx --yes wrangler@3 pages deploy out --project-name=donchaengim --branch=main --commit-dirty=true
      - name: Save data to money-data branch
        run: |
          cd money/data
          git init -q -b money-data
          git config user.name "money-bot"; git config user.email "money-bot@users.noreply.github.com"
          git add -A && git commit -qm "data $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" money-data
