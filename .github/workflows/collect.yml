name: collect

# 매시간 7분에 실행 (정각은 GitHub 서버가 붐벼 지연이 잦음)
on:
  schedule:
    - cron: "7 * * * *"
  # 수집기 코드를 고치면 바로 한 번 실행
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "site/**"
      - ".github/workflows/collect.yml"
      - "rerun.txt"  # 이 파일을 고치면 수동 재실행
  workflow_dispatch:
    inputs:
      force_discover:
        description: "새 쇼츠 찾기(검색)를 지금 바로 실행"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 수집 상태는 'data' 브랜치에 파일 하나로 보관하고, 매번 덮어써서 저장소가 커지지 않게 함
      - name: Load state
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git show origin/data:state.json.gz > state/state.json.gz
          fi

      - name: Collect
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          python collector/collect.py --state state/state.json.gz --out site/data ${{ inputs.force_discover && '--force-discover' || '' }}

      - name: Save state
        run: |
          cd state
          git init -q -b data
          git config user.name "risingshorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json.gz
          git commit -qm "state $(date -u +%Y-%m-%dT%H)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data:data

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@3 pages project create risingshorts --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site --project-name=risingshorts --branch=main --commit-dirty=true
