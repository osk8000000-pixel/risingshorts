name: collect

# 시간당 2번 예약 (7분, 37분). GitHub 예약 실행은 가끔 빠지거나 늦어지므로,
# 수집기는 직전 실행 후 45분이 안 지났으면 건너뛰어 사실상 매시간 1번만 수집합니다.
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  # 수집기 코드를 고치면 바로 한 번 실행
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "site/**"
      - ".github/workflows/collect.yml"
      - "rerun.txt"  # 이 파일을 고치면 수동 재실행
  workflow_dispatch:
    inputs:
      force_discover:
        description: "새 쇼츠 찾기(검색)를 지금 바로 실행"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 수집 상태는 'data' 브랜치에 파일 하나로 보관하고, 매번 덮어써서 저장소가 커지지 않게 함
      - name: Load state
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:state.json.gz > state/state.json.gz
          fi

      - name: Collect
        id: collect
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          python collector/collect.py --state state/state.json.gz --out site/data ${{ inputs.force_discover && '--force-discover' || '' }}

      # 저장 실패가 가끔 있어 3번까지 다시 시도. 토큰은 checkout이 설정한 인증 헤더를 그대로 씀(주소에 넣지 않음)
      - name: Save state
        run: |
          HEADER="$(git config --get http.https://github.com/.extraheader)"
          cd state
          git init -q -b data
          git config user.name "risingshorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "$HEADER"
          git add state.json.gz
          git commit -qm "state $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do
            if out=$(git push -f "https://github.com/${{ github.repository }}.git" data:data 2>&1); then
              echo "saved (try $i)"; exit 0
            fi
            echo "::warning::상태 저장 재시도 $i: $(echo "$out" | tail -2 | tr '\n' ' ')"
            sleep $((i * 15))
          done
          echo "::error::상태 저장 3번 실패: $(echo "$out" | tail -3 | tr '\n' ' ')"
          exit 1

      # 저장이 실패해도 수집 결과는 사이트에 반영
      - name: Deploy to Cloudflare Pages
        if: ${{ always() && steps.collect.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create risingshorts --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site --project-name=risingshorts --branch=main --commit-dirty=true
