name: ipo-probe-dart
on:
  push:
    paths: ["ipo/tools/probe_dart.py", ".github/workflows/ipo-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Probe DART
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python ipo/tools/probe_dart.py
