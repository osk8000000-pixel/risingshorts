name: money-probe
on:
  push:
    paths: [money/tools/probe.py, .github/workflows/money-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python money/tools/probe.py
        env:
          FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
